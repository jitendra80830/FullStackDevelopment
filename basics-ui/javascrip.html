<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple App</title>
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      const randomNumner = Math.floor(Math.random() * 100) + 1;
      const numberElement = document.createElement("h1");
      numberElement.innerHTML = `Generated Number is ${randomNumner}`;
      const resultElement = document.createElement("h2");
      if (randomNumner % 2 == 0) {
        resultElement.innerHTML = "The number is even.";
      } else {
        resultElement.innerHTML = "The number is odd.";
      }

      const root = document.getElementById("root");
      root.appendChild(numberElement);
      root.appendChild(resultElement);
    </script>
  </body>
</html>
