<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nested child App</title>
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <h1>This is root supper heading</h1>
    <div id="root">
      <h2>This is child of root</h2>
    </div>
    <h2>Thi is footer heading</h2>
    <script src="./react-lib/react-dom.development.js"></script>
    <script src="./react-lib/react.development.js"></script>
    <script>
      const nestedElement = React.createElement("div", { id: "parent" }, [
        React.createElement("div", { id: "child1" }, [
          React.createElement(
            "h1",
            { style: { color: "blue" } },
            "Hi, This is child1 element1",
          ),
          React.createElement(
            "h2",
            { style: { color: "red" } },
            "This is child element2",
          ),
        ]),

        React.createElement("div", { id: "child2" }, [
          React.createElement("h1", {}, "This is child2 element1"),
          React.createElement("h2", {}, "This is child2 element2"),
        ]),
      ]);

      const root = ReactDOM.createRoot(document.getElementById("root"));

      root.render(nestedElement);
    </script>
  </body>
</html>
